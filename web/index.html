<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>Keyur Pawaskar | Software Engineer</title>
    <meta name="title" content="Keyur Pawaskar | Software Engineer" />
    <meta name="description" content="Full-stack developer turning ideas into production-ready apps. Specializing in React, TypeScript, Python, and FastAPI." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://keyur-portfolio-psi.vercel.app/" />
    <meta property="og:title" content="Keyur Pawaskar | Software Engineer" />
    <meta property="og:description" content="Building AI-powered full-stack applications — from LLM agents to real-time collaborative tools. React, TypeScript, Python, FastAPI." />
    <meta property="og:image" content="https://keyur-portfolio-psi.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://keyur-portfolio-psi.vercel.app/" />
    <meta property="twitter:title" content="Keyur Pawaskar | Software Engineer" />
    <meta property="twitter:description" content="Building AI-powered full-stack applications — from LLM agents to real-time collaborative tools. React, TypeScript, Python, FastAPI." />
    <meta property="twitter:image" content="https://keyur-portfolio-psi.vercel.app/og-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e2127" media="(prefers-color-scheme: dark)" />

    <!-- Canonical -->
    <link rel="canonical" href="https://keyur-portfolio-psi.vercel.app/" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Keyur Pawaskar",
        "jobTitle": "Software Engineer",
        "url": "https://keyur-portfolio-psi.vercel.app/",
        "sameAs": [
          "https://github.com/keyur7523",
          "https://www.linkedin.com/in/keyur-pawaskar-7b05b6169/"
        ],
        "alumniOf": "California State University, Fresno",
        "knowsAbout": ["LLM agents", "React", "TypeScript", "Python", "FastAPI", "AI systems"]
      }
    </script>

    <!-- Set theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          /* v3 key: the redesign starts everyone on light once, then respects their toggle choice */
          var saved = localStorage.getItem('theme-v3');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
